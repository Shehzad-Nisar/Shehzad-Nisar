<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shehzad Nisar — Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect width="1200" height="260" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="12" fill="none" stroke="#1F2630" stroke-width="1.2"/>

  <!-- terminal chrome -->
  <circle cx="34" cy="34" r="6" fill="#2A313B"/>
  <circle cx="54" cy="34" r="6" fill="#2A313B"/>
  <circle cx="74" cy="34" r="6" fill="#2A313B"/>
  <text x="100" y="39" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#4B5563">shehzad@engine:~$</text>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1F2630" stroke-width="1"/>

  <!-- meaningful binary : S H E H Z A D -->
  <text x="60" y="98" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#2DD4BF" opacity="0.6">01010011 01001000 01000101 01001000 01011010 01000001 01000100</text>

  <!-- name -->
  <text x="58" y="160" font-family="'JetBrains Mono',Consolas,monospace" font-size="46" font-weight="700" fill="#E6EDF3">SHEHZAD NISAR</text>
  <rect x="452" y="126" width="13" height="38" fill="#2DD4BF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="60" y="196" font-family="'JetBrains Mono',Consolas,monospace" font-size="15.5" letter-spacing="0.5" fill="#8B949E">SOFTWARE ENGINEER &#183; BACKEND SYSTEMS &#183; JAVA &amp; SPRING BOOT</text>

  <!-- status -->
  <circle cx="63" cy="223" r="4" fill="#2DD4BF">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="227" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#2DD4BF">ACCESS GRANTED</text>
  <text x="220" y="227" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#4B5563">// systems online</text>
</svg>
